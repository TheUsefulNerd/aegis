name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # CPU-only torch first: the default Linux wheel pulls several GB of
      # CUDA libraries the tests never use (they don't load the model at all).
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      # Fully offline: conftest.py blanks every API key and mocks the LLM and
      # embedding model, so no secrets are needed here.
      - run: python -m pytest -q tests
      # AEGIS as a pipeline step: audit the sample and held-out configs (AI
      # off), write SARIF, and sign the results. --fail-on none because the
      # samples are misconfigured on purpose; a real pipeline would use the
      # default (fail the build on any CAT I finding).
      - name: AEGIS audit (SARIF + signed attestations)
        run: >
          python -m app.cli audit ../samples/sample_input_config_files/0*.* ../samples/heldout/heldout_*
          --sarif aegis.sarif --attest aegis-attestations.json --fail-on none
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-audit
          path: |
            backend/aegis.sarif
            backend/aegis-attestations.json
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true  # code scanning may be off for the repo; the artifact above always exists
        with:
          sarif_file: backend/aegis.sarif
          category: aegis

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `next build` also type-checks the whole app (a standalone `tsc` fails on
      # a fresh checkout: next-env.d.ts is generated by Next and gitignored).
      - run: npm run build
