# Reviewed mappings: imported DISA STIG rule -> executable AEGIS check.
#
# catalog/<benchmark>.json holds every rule of the benchmark as DISA publishes
# it (app/stig_sync.py). A rule is evaluated only if it is listed here, and
# only while its check_sha still matches the imported check text: when DISA
# revises a check in a new release the mapping is set aside as "needs
# re-review" (catalog_rules.py) instead of evaluating an outdated check.
# Everything not listed is reported as manual review.
#
# Each mapping was checked against the rule's DISA check text (2026-09-27),
# quoted in `note`. Rules left out on purpose, although a draft proposed them:
#   V-215833  Cisco 5-min timeout on ALL management lines incl. console; only
#             VTY blocks are scoped, so a console at 0 could hide -> false PASS
#   V-223231  Juniper per-class idle-timeout: a class with no timeout line
#             can hide behind a compliant one -> false PASS
#   V-234213, V-234214  FortiGate admintimeout: check says exactly 10
#   V-234183  FortiGate NTP: ntpsync / type custom not checked -> false PASS
#   V-223181..184, V-223192, V-223193  Juniper change-log to an external host:
#             that line already sets AU.logging_host (one field per line)
# FortiGate password rules require `set status enable` explicitly: the policy is
# disabled by default, and sub-options can be present while it is off
# (second review: a disabled policy with minimum-length 15 passed).
# Added 2026-09-28 (checked against each rule's DISA check text):
#   "on all EXTERNAL interfaces" rules PASS only when EVERY interface complies
#   (AEGIS can't tell which are external) and are unknown otherwise, never a
#   FAIL that might be about an internal interface. FAIL-only rules (the
#   requirement is the absence of a line, so a PASS would rest on a default):
#   V-216654, V-216649, V-215823, V-223237, V-223209.
# Rejected on 2026-09-28:
#   V-216656  ip mask-reply on EXTERNAL interfaces: found on an internal one
#             would be a false FAIL, and absence is only the default
#   V-216646  inactive interfaces: which are unused is not in the config
#   V-215818 / V-216659 / V-216660  log-input on every deny of every applied
#             ACL: needs an ACL-level predicate the engine does not have yet
#   V-215855  backup on change: an EEM applet's actions can't be verified
#   V-215841 / V-215842  SNMPv3 algorithms live in `show snmp user`, not the
#             config
#   V-223232 / V-223234 / V-234219  organization-defined values
#   V-223185 / V-223199 / V-229015  console display settings the check
#             leaves unspecified
#   V-234202 / V-234184  runtime (`diagnose sys ntp status`) or GUI-only
#   V-234211 / V-234212  "the management interface": which one is not in
#             the config
# Severity comes from the catalog (high/medium/low -> CAT I/II/III). A failed
# rule shows its remediation template, or else DISA's own fix text.

