# DRAFT - executable-check mappings for the imported DISA STIG catalogs
# (cyber.trackr.live JSON in this folder). Not loaded by anything yet.
# Generated 2026-09-27 by reading every rule's CHECK text.
#
# decision:
#   map                 - an EXISTING canonical field + predicate decides the check text
#   new_field           - decidable with one of the new_fields below (seeds proposed)
#   manual              - needs docs / org values / runtime state / GUI, or too complex
#   already_implemented - live in backend/app/rules/stig_cisco_ios_xe.yaml
# caveat:          a known limit of the mapping (read before enabling the rule)
# requires_engine: the rule needs the engine change named in engine_changes before
#                  it can ever decide (until then it is NOT_EVALUATED, never wrong)

engine_changes:
  - id: list_count_range
    description: 'rule_engine._eval_range on a list field should compare len(set(values)) with min/max ("at least two NTP / syslog servers"). Today float(list) raises and the rule returns NOT_EVALUATED.'

new_fields:
  - field: AU.admin_event_logging
    type: scalar
    value_kind: bool
    insecure: false
    label: "Admin/config-change event logging"
    description: "Whether the device records administrative and configuration-change events (account creation/modification/removal, privilege changes, config commands) as audit records."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^logging enable$', pattern_type: regex, canonical_field: AU.admin_event_logging, value: true}
      juniper_junos:
        - {syntax_pattern: '^set system syslog host \S+ (any|change-log) (info|any)$', pattern_type: regex, canonical_field: AU.admin_event_logging, value: true}
      fortinet_fortios:
        - {syntax_pattern: '^log eventfilter set (event|system) disable\b', pattern_type: regex, canonical_field: AU.admin_event_logging, value: false}
        - {syntax_pattern: '^log eventfilter set (event|system) enable\b', pattern_type: regex, canonical_field: AU.admin_event_logging, value: true}
    defaults:
      cisco_ios: {value: false, note: "archive / log config / logging enable is off by default"}
    notes: "Cisco: `logging enable` only exists under `archive` > `log config` (units are standalone lines, parent not kept). Juniper: only an external `host` stanza at facility any|change-log, severity info|any counts, per the STIG check; no false-seed on purpose (a second, weaker host would otherwise win the least-secure merge). FortiOS: event and system both default to enable, so a plain `show` export often omits them (field absent -> NOT_EVALUATED)."
  - field: AC.login_max_failed_attempts
    type: scalar
    value_kind: number
    worse: higher_or_zero
    label: "Failed logon attempts before lockout"
    description: "How many consecutive invalid logon attempts are allowed before the device blocks further logons."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^login block-for \d+ attempts (\d+) within \d+', pattern_type: regex, canonical_field: AC.login_max_failed_attempts, value: "$1"}
      juniper_junos:
        - {syntax_pattern: '^set system login retry-options tries-before-disconnect (\d+)', pattern_type: regex, canonical_field: AC.login_max_failed_attempts, value: "$1"}
      fortinet_fortios:
        - {syntax_pattern: '^system global set admin-lockout-threshold (\d+)', pattern_type: regex, canonical_field: AC.login_max_failed_attempts, value: "$1"}
    notes: "The Cisco `login block-for` line also carries the lockout period, but one unit resolves to one field, so the period is not captured."
  - field: AU.ntp_servers
    type: list
    label: "NTP servers"
    description: "Address(es) of the time servers the device synchronizes its clock with."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^ntp server (?:vrf \S+ )?(?:ip |ipv6 )?([\w.:-]+)', pattern_type: regex, canonical_field: AU.ntp_servers, value: "$1"}
      juniper_junos:
        - {syntax_pattern: '^set system ntp server ([\w.:-]+)', pattern_type: regex, canonical_field: AU.ntp_servers, value: "$1"}
      fortinet_fortios:
        - {syntax_pattern: '^system ntp ntpserver edit \S+ set server \"?([\w.:-]+)', pattern_type: regex, canonical_field: AU.ntp_servers, value: "$1"}
    notes: "The primary+secondary rules need a count (>= 2): see engine_changes."
  - field: IA.password_min_length
    type: scalar
    value_kind: number
    worse: lower
    label: "Minimum password length"
    description: "Minimum number of characters the device's local password policy requires."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^min-length (\d+)$', pattern_type: regex, canonical_field: IA.password_min_length, value: "$1"}
      juniper_junos:
        - {syntax_pattern: '^set system login password minimum-length (\d+)', pattern_type: regex, canonical_field: IA.password_min_length, value: "$1"}
      fortinet_fortios:
        - {syntax_pattern: '^system password-policy set status disable\b', pattern_type: regex, canonical_field: IA.password_min_length, value: 0}
        - {syntax_pattern: '^system password-policy set minimum-length (\d+)', pattern_type: regex, canonical_field: IA.password_min_length, value: "$1"}
    notes: "Cisco: child line of `aaa common-criteria policy NAME`. FortiOS: a disabled policy enforces no minimum, so `status disable` resolves to 0 (lowest wins the merge)."
  - field: IA.password_min_uppercase
    type: scalar
    value_kind: number
    worse: lower
    label: "Required uppercase characters"
    description: "Minimum number of uppercase letters the local password policy requires."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^upper-case (\d+)$', pattern_type: regex, canonical_field: IA.password_min_uppercase, value: "$1"}
      juniper_junos:
        - {syntax_pattern: '^set system login password minimum-upper-cases (\d+)', pattern_type: regex, canonical_field: IA.password_min_uppercase, value: "$1"}
      fortinet_fortios:
        - {syntax_pattern: '^system password-policy set min-upper-case-letter (\d+)', pattern_type: regex, canonical_field: IA.password_min_uppercase, value: "$1"}
  - field: IA.password_min_lowercase
    type: scalar
    value_kind: number
    worse: lower
    label: "Required lowercase characters"
    description: "Minimum number of lowercase letters the local password policy requires."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^lower-case (\d+)$', pattern_type: regex, canonical_field: IA.password_min_lowercase, value: "$1"}
      juniper_junos:
        - {syntax_pattern: '^set system login password minimum-lower-cases (\d+)', pattern_type: regex, canonical_field: IA.password_min_lowercase, value: "$1"}
      fortinet_fortios:
        - {syntax_pattern: '^system password-policy set min-lower-case-letter (\d+)', pattern_type: regex, canonical_field: IA.password_min_lowercase, value: "$1"}
  - field: IA.password_min_numeric
    type: scalar
    value_kind: number
    worse: lower
    label: "Required numeric characters"
    description: "Minimum number of digits the local password policy requires."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^numeric-count (\d+)$', pattern_type: regex, canonical_field: IA.password_min_numeric, value: "$1"}
      juniper_junos:
        - {syntax_pattern: '^set system login password minimum-numerics (\d+)', pattern_type: regex, canonical_field: IA.password_min_numeric, value: "$1"}
      fortinet_fortios:
        - {syntax_pattern: '^system password-policy set min-number (\d+)', pattern_type: regex, canonical_field: IA.password_min_numeric, value: "$1"}
  - field: IA.password_min_special
    type: scalar
    value_kind: number
    worse: lower
    label: "Required special characters"
    description: "Minimum number of special (punctuation / non-alphanumeric) characters the local password policy requires."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^special-case (\d+)$', pattern_type: regex, canonical_field: IA.password_min_special, value: "$1"}
      juniper_junos:
        - {syntax_pattern: '^set system login password minimum-punctuations? (\d+)', pattern_type: regex, canonical_field: IA.password_min_special, value: "$1"}
      fortinet_fortios:
        - {syntax_pattern: '^system password-policy set min-non-alphanumeric (\d+)', pattern_type: regex, canonical_field: IA.password_min_special, value: "$1"}
  - field: IA.password_min_changed_chars
    type: scalar
    value_kind: number
    worse: lower
    label: "Characters changed on password change"
    description: "Minimum number of character positions that must differ when a password is changed."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^char-changes (\d+)$', pattern_type: regex, canonical_field: IA.password_min_changed_chars, value: "$1"}
      fortinet_fortios:
        - {syntax_pattern: '^system password-policy set change-8-characters enable\b', pattern_type: regex, canonical_field: IA.password_min_changed_chars, value: 8}
        - {syntax_pattern: '^system password-policy set change-8-characters disable\b', pattern_type: regex, canonical_field: IA.password_min_changed_chars, value: 0}
    notes: "FortiOS keyword taken verbatim from the STIG check text (`change-8-characters`); if a FortiOS release spells it differently nothing matches and the rule stays NOT_EVALUATED. Juniper has no equivalent setting."
  - field: IA.remote_auth_servers
    type: list
    label: "Central authentication servers"
    description: "RADIUS / TACACS+ / LDAP servers configured for administrator authentication."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^(?:radius-server|tacacs-server) host ([\w.:-]+)', pattern_type: regex, canonical_field: IA.remote_auth_servers, value: "$1"}
      juniper_junos:
        - {syntax_pattern: '^set system (?:radius-server|tacplus-server) ([\w.:-]+)', pattern_type: regex, canonical_field: IA.remote_auth_servers, value: "$1"}
      fortinet_fortios:
        - {syntax_pattern: '^user (?:ldap|radius|tacacs\+) edit \S+ set server \"?([\w.:-]+)', pattern_type: regex, canonical_field: IA.remote_auth_servers, value: "$1"}
    notes: "Server presence only - not whether an AAA method list uses it. That is enough for the Juniper checks (\"configured to use at least one RADIUS or TACACS+ server\") but not for Cisco V-215854, which stays manual. The newer IOS-XE `radius server NAME` / `address ipv4 X` block form is not seeded (the child line is ambiguous without its parent)."
  - field: SC.ssh_macs_fips_only
    type: scalar
    value_kind: bool
    insecure: false
    label: "SSH MACs restricted to FIPS SHA-2"
    description: "Whether the SSH server is explicitly restricted to FIPS-validated SHA-2 HMACs (hmac-sha2-256/512), with no SHA-1 or MD5 MAC allowed."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^ip ssh server algorithm mac( hmac-sha2-(256|512)(-etm@openssh\.com)?)+$', pattern_type: regex, canonical_field: SC.ssh_macs_fips_only, value: true}
        - {syntax_pattern: '^ip ssh server algorithm mac (?!((hmac-sha2-(256|512)(-etm@openssh\.com)?) ?)+$)', pattern_type: regex, canonical_field: SC.ssh_macs_fips_only, value: false}
      juniper_junos:
        - {syntax_pattern: '^set system services ssh macs (\[ )?((hmac-sha2-(256|512)(-etm@openssh\.com)?) ?)+\]?$', pattern_type: regex, canonical_field: SC.ssh_macs_fips_only, value: true}
        - {syntax_pattern: '^set system services ssh macs (?!(\[ )?((hmac-sha2-(256|512)(-etm@openssh\.com)?) ?)+\]?$)', pattern_type: regex, canonical_field: SC.ssh_macs_fips_only, value: false}
      fortinet_fortios:
        - {syntax_pattern: '^system global set ssh-hmac-md5 enable\b', pattern_type: regex, canonical_field: SC.ssh_macs_fips_only, value: false}
    defaults:
      cisco_ios: {value: false, note: "without `ip ssh server algorithm mac`, the IOS-XE default MAC list includes hmac-sha1"}
    notes: "Junos set-style exports give one `macs X` line per algorithm; each resolves separately and the least-secure value wins, which is the right aggregate. Regexes tested against sample lines (both list forms)."
  - field: SC.ssh_ciphers_fips_only
    type: scalar
    value_kind: bool
    insecure: false
    label: "SSH ciphers restricted to FIPS AES"
    description: "Whether the SSH server is explicitly restricted to FIPS-approved AES CTR/GCM ciphers, with no CBC, 3DES or other cipher allowed."
    seeds:
      cisco_ios:
        - {syntax_pattern: '^ip ssh server algorithm encryption( (aes(128|192|256)-ctr|aes(128|256)-gcm(@openssh\.com)?))+$', pattern_type: regex, canonical_field: SC.ssh_ciphers_fips_only, value: true}
        - {syntax_pattern: '^ip ssh server algorithm encryption (?!((aes(128|192|256)-ctr|aes(128|256)-gcm(@openssh\.com)?) ?)+$)', pattern_type: regex, canonical_field: SC.ssh_ciphers_fips_only, value: false}
      juniper_junos:
        - {syntax_pattern: '^set system services ssh ciphers (\[ )?((aes(128|192|256)-ctr|aes(128|256)-gcm@openssh\.com) ?)+\]?$', pattern_type: regex, canonical_field: SC.ssh_ciphers_fips_only, value: true}
        - {syntax_pattern: '^set system services ssh ciphers (?!(\[ )?((aes(128|192|256)-ctr|aes(128|256)-gcm@openssh\.com) ?)+\]?$)', pattern_type: regex, canonical_field: SC.ssh_ciphers_fips_only, value: false}
      fortinet_fortios:
        - {syntax_pattern: '^system global set ssh-cbc-cipher enable\b', pattern_type: regex, canonical_field: SC.ssh_ciphers_fips_only, value: false}
    notes: "Juniper V-223227 also requires key-exchange algorithms, which this field does not cover, so it stays manual."

