    V-215832:
      decision: map
      check_type: boolean
      predicate: {"field": "IA.password_encryption_enabled", "equals": true}
      why: "check text: 'service password-encryption' / finding if 'not configured to encrypt passwords'"
    V-215833:
      decision: map
      check_type: range
      predicate: {"field": "AC.session_idle_timeout_minutes", "max": 5, "exclusive_min": 0}
      why: "check text: 'idle timeout value set to five minutes or less ... line con 0 / exec-timeout 5 0, line vty ... exec-timeout 5 0'"
      caveat: "the seed keeps only the minutes of `exec-timeout M S`; a line block with NO exec-timeout (device default 10) contributes nothing, so a config setting 5 on con but nothing on vty would PASS. The HTTP `ip http timeout-policy idle` part is not checked (IOS default is 180 s, compliant)."
