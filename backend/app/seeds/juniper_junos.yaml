# Juniper Junos (SRX / MX / EX), added 2026-09-27 as data only: this file is
# the whole vendor - its fingerprint and its Tier-1 patterns. No Python was
# written for it. units.py flattens brace blocks (`system { services {
# telnet; } }`) and set-style exports alike into `set system services
# telnet`, so every pattern below is written once, in set form.
#
# Patterns follow the Junos CLI reference (system services, system syslog,
# system login, snmp). Anything not listed goes to the AI and then a human,
# like every other vendor.

fingerprint:
  format: cli
  version_family: junos
  priority: 10
  signals:
    - '^version \S+;\s*$'                                # hierarchical export header
    - '^set version \S+'                                  # set-format export header
    - '^set (system|interfaces|security|firewall|protocols) '
    - '^\s*system \{\s*$'
    - '^## Last (commit|changed)'
  min: 1
  high_at: 2

vendor: juniper_junos
entries:
  - {syntax_pattern: '^set system services telnet\b', pattern_type: regex, canonical_field: AC.telnet_enabled, value: true}
  - {syntax_pattern: '^set system services ssh protocol-version v2\b', pattern_type: regex, canonical_field: IA.ssh_version, value: 2}
  - {syntax_pattern: '^set system services ssh protocol-version v1\b', pattern_type: regex, canonical_field: IA.ssh_version, value: 1}
  - {syntax_pattern: '^set system services web-management https\b', pattern_type: regex, canonical_field: SC.webgui_protocol, value: true}
  - {syntax_pattern: '^set system services web-management http( |$)', pattern_type: regex, canonical_field: SC.webgui_protocol, value: false}
  # A host only receives messages for the facilities listed under it (final
  # review #4: a bare `host X` sends nothing).
  - {syntax_pattern: '^set system syslog host ([\w.:-]+) (?!source-address|port|structured-data|match|routing-instance)\S+ \S+', pattern_type: regex, canonical_field: AU.logging_host, value: "$1"}
  - {syntax_pattern: '^set system syslog (host|file) ', pattern_type: regex, canonical_field: AU.logging_enabled, value: true}
  - {syntax_pattern: '^set system login message ', pattern_type: regex, canonical_field: AC.login_banner_configured, value: true}
  - {syntax_pattern: '^set system login class \S+ idle-timeout (\d+)', pattern_type: regex, canonical_field: AC.session_idle_timeout_minutes, value: "$1"}
  - {syntax_pattern: '^set system ntp authentication-key ', pattern_type: regex, canonical_field: AU.ntp_authentication_enabled, value: true}
  - {syntax_pattern: '^set snmp community (public|private)\b', pattern_type: regex, canonical_field: AC.snmp_community_strings, value: "$1"}
  - {syntax_pattern: '^set snmp community \[REDACTED:', pattern_type: regex, canonical_field: AC.snmp_community_strings, value: "custom (redacted)"}
  - {syntax_pattern: '^set protocols (ospf|bgp|isis) .*authentication', pattern_type: regex, canonical_field: SC.routing_authentication, value: true}

  # For the imported DISA STIG catalog (rules/stig_catalog_map.yaml); patterns
  # follow the SRX NDM STIG fix text.
  - {syntax_pattern: '^set system login retry-options tries-before-disconnect (\d+)', pattern_type: regex, canonical_field: AC.login_max_failed_attempts, value: "$1"}
  - {syntax_pattern: '^set system ntp server ([\w.:-]+)', pattern_type: regex, canonical_field: AU.ntp_servers, value: "$1"}
  - {syntax_pattern: '^set system login password minimum-length (\d+)', pattern_type: regex, canonical_field: IA.password_min_length, value: "$1"}
  - {syntax_pattern: '^set system login password minimum-upper-cases (\d+)', pattern_type: regex, canonical_field: IA.password_min_uppercase, value: "$1"}
  - {syntax_pattern: '^set system login password minimum-lower-cases (\d+)', pattern_type: regex, canonical_field: IA.password_min_lowercase, value: "$1"}
  - {syntax_pattern: '^set system login password minimum-numerics (\d+)', pattern_type: regex, canonical_field: IA.password_min_numeric, value: "$1"}
  - {syntax_pattern: '^set system login password minimum-punctuations? (\d+)', pattern_type: regex, canonical_field: IA.password_min_special, value: "$1"}
  - {syntax_pattern: '^set system (?:radius-server|tacplus-server) ([\w.:-]+)', pattern_type: regex, canonical_field: IA.remote_auth_servers, value: "$1"}
  # One `macs X` line per algorithm in set form; the least secure line wins.
  - {syntax_pattern: '^set system services ssh macs (\[ )?(hmac-sha2-(256|512)(-etm@openssh\.com)? ?)+\]?$', pattern_type: regex, canonical_field: SC.ssh_macs_fips_only, value: true}
  - {syntax_pattern: '^set system services ssh macs ', pattern_type: regex, canonical_field: SC.ssh_macs_fips_only, value: false}
  # 2026-09-28, more SRX NDM STIG rules (V3R3 check text).
  - {syntax_pattern: '^set system services ssh root-login deny$', pattern_type: regex, canonical_field: IA.ssh_root_login_denied, value: true}
  - {syntax_pattern: '^set system services ssh root-login (allow|deny-password)$', pattern_type: regex, canonical_field: IA.ssh_root_login_denied, value: false}
  - {syntax_pattern: '^set system services ssh no-tcp-forwarding$', pattern_type: regex, canonical_field: SC.ssh_tcp_forwarding_disabled, value: true}
  - {syntax_pattern: '^set system services ssh allow-tcp-forwarding$', pattern_type: regex, canonical_field: SC.ssh_tcp_forwarding_disabled, value: false}
  - {syntax_pattern: '^set system services ssh connection-limit (\d+)$', pattern_type: regex, canonical_field: AC.ssh_connection_limit, value: "$1"}
  - {syntax_pattern: '^set system services ftp\b', pattern_type: regex, canonical_field: SC.ftp_enabled, value: true}
  - {syntax_pattern: '^set system max-configuration-rollbacks (\d+)$', pattern_type: regex, canonical_field: CM.config_rollbacks, value: "$1"}

  # V-223236: Junos 12.1X46 or later. 13.x+ passes, 11.x and older fails;
  # 12.x and build strings (e.g. 20200609.165031...) stay unknown.
  - {syntax_pattern: '^set version (1[3-9]|[2-9]\d)\.\d', pattern_type: regex, canonical_field: CM.os_min_version_met, value: true}
  - {syntax_pattern: '^set version (\d|1[01])\.\d', pattern_type: regex, canonical_field: CM.os_min_version_met, value: false}
  # Known non-security structure: instant, no AI call, no review item.
  - {syntax_pattern: '^set version ', pattern_type: regex, canonical_field: NOT_SECURITY}
  # `deactivate <path>` is applied by units.py (the statements under it are
  # dropped as evidence); the line itself is not a setting.
  - {syntax_pattern: '^deactivate ', pattern_type: regex, canonical_field: NOT_SECURITY}
  # Found by the live held-out run, where the AI misread both:
  # an SNMP trap target is not a syslog destination, and a zone's
  # host-inbound-traffic only admits traffic to services that `system
  # services` enables (telnet there is not telnet enabled).
  - {syntax_pattern: '^set snmp trap-group ', pattern_type: regex, canonical_field: NOT_SECURITY}
  - {syntax_pattern: '^set security zones security-zone \S+ (interfaces \S+ )?host-inbound-traffic ', pattern_type: regex, canonical_field: NOT_SECURITY}
  - {syntax_pattern: '^set system (host-name|domain-name|name-server|time-zone) ', pattern_type: regex, canonical_field: NOT_SECURITY}
  - {syntax_pattern: '^set interfaces \S+ (unit \d+ family \S+ address|mtu|speed|link-mode) ', pattern_type: regex, canonical_field: NOT_SECURITY}
  - {syntax_pattern: '^set routing-options (static|router-id|autonomous-system) ', pattern_type: regex, canonical_field: NOT_SECURITY}
  - {syntax_pattern: '^set chassis ', pattern_type: regex, canonical_field: NOT_SECURITY}

# Vendor defaults (vendor_defaults.py): only for a high-confidence full
# export, and only ever to FAIL a rule.
defaults:
  - {field: AU.logging_host, value: [], note: "Junos sends syslog to no remote host unless system syslog host is set"}
  - {field: IA.ssh_root_login_denied, value: false, note: "root-login defaults to allow (deny-password on newer releases), never deny"}
  - {field: SC.ssh_tcp_forwarding_disabled, value: false, note: "SSH TCP forwarding is allowed unless no-tcp-forwarding"}
  - {field: AC.ssh_connection_limit, value: 75, note: "the SSH connection-limit defaults to 75"}
  - {field: AU.remote_syslog_changelog, value: false, note: "no syslog host by default"}
  - {field: AU.remote_syslog_all_info, value: false, note: "no syslog host by default"}
  - {field: AU.remote_syslog_all_any, value: false, note: "no syslog host by default"}
  - {field: AU.local_syslog_all_any, value: false, note: "the default messages file logs any notice, not any any"}

# A line present anywhere decides these (vendor_defaults unit_facts). Each
# syslog line is `set system syslog host <addr> <facility> <severity>`; the
# seed above already turns it into AU.logging_host, and one line resolves to
# one field, so the facility/severity facts are read here.
unit_facts:
  - {field: AU.remote_syslog_changelog, value: true, any: '^set system syslog host \S+ (any|change-log) (info|any)$'}
  - {field: AU.remote_syslog_all_info, value: true, any: '^set system syslog host \S+ any (info|any)$'}
  - {field: AU.remote_syslog_all_any, value: true, any: '^set system syslog host \S+ any any$'}
  - {field: AU.local_syslog_all_any, value: true, any: '^set system syslog file \S+ any any$'}
  - {field: SC.web_management_enabled, value: true, any: '^set system services web-management\b'}
  - {field: AU.timezone_utc, value: true, any: '^set system time-zone (UTC|GMT|Etc/UTC|Etc/GMT)$'}
  - {field: AU.timezone_utc, value: false, any: '^set system time-zone \S+$'}

# Every SNMPv3 user must be configured strongly (full export only).
entry_scoped:
  - field: SC.snmpv3_auth_sha2
    label: SNMPv3 user
    entry: '^set snmp v3 usm (?:local-engine|remote-engine \S+) user (\S+) '
    require: ['^authentication-sha(256|384|512)\b']
    note: "every SNMPv3 user authenticates with SHA-256 or stronger"
  - field: SC.snmpv3_priv_aes
    label: SNMPv3 user
    entry: '^set snmp v3 usm (?:local-engine|remote-engine \S+) user (\S+) '
    require: ['^privacy-aes128\b']
    note: "every SNMPv3 user uses AES privacy"
