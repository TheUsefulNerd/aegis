# Tier-1 seed KB for cisco_ios - exact-match only (architecture-document.md
# §1/§3 step 4: Tier 1 is deterministic exact/structural match, not a
# learned generalization). Two kinds of entries here:
#
# 1. Tied to this specific demo sample (samples/cisco_ios_sample.txt) -
#    won't match a differently-worded real config, and isn't meant to; a
#    genuinely new line correctly falls through to Tier 2/3, which is by
#    design, not a gap.
# 2. Genuinely general despite being "exact match", because redaction
#    normalizes the variable part away first - e.g. every type-5 `enable
#    secret` line redacts to the exact same text regardless of the real
#    hash, so that entry matches ANY cisco_ios config using that type, not
#    just this sample's.
#
# Found and fixed 2026-09-15: before this file existed, there was no Tier-1
# seeding at all despite architecture-document.md describing Cisco IOS as
# "Seeded Tier 1" - every prior "Tier 1 hit" in testing actually came from
# accumulated manual review-queue confirmations in a dev DB that isn't
# committed anywhere (*.db is gitignored). A fresh clone + fresh DB
# following this repo's own README would have hit Tier 2 cold for
# "transport input ssh" and gotten it wrong every time (see resolve.py's
# docstring is aspirational without this file) - verified via a direct
# repeated Tier-2 test, not assumed.

fingerprint:
  format: cli
  version_family: ios
  priority: 50
  # IOS/IOS-XE: a `version 15.5` banner (no trailing semicolon - that is
  # Junos) and `line vty` blocks; either alone is medium confidence.
  signals:
    - '^version \d+\.\d+[^;\s]*$'
    - '^line vty '
  min: 1
  high_at: 2

vendor: cisco_ios
entries:
  - syntax_pattern: "transport input ssh"
    canonical_field: AC.telnet_enabled
    value: false

  - syntax_pattern: "ip ssh version 2"
    canonical_field: IA.ssh_version
    value: 2

  - syntax_pattern: "service password-encryption"
    canonical_field: IA.password_encryption_enabled
    value: true

  # General (redaction-normalized) - matches any cisco_ios config using
  # that enable-secret type, not just this sample's specific hash.
  - syntax_pattern: "enable secret 5 [REDACTED:ENABLE_SECRET_HASH]"
    canonical_field: AC.privileged_password_type
    value: secret_type_5
  - syntax_pattern: "enable secret 8 [REDACTED:ENABLE_SECRET_HASH]"
    canonical_field: AC.privileged_password_type
    value: secret_type_8
  - syntax_pattern: "enable secret 9 [REDACTED:ENABLE_SECRET_HASH]"
    canonical_field: AC.privileged_password_type
    value: secret_type_9

  # Sample-specific (tied to this exact IP/ACL text).
  - syntax_pattern: "logging host 10.0.0.5"
    canonical_field: AU.logging_host
    value: "10.0.0.5"
  - syntax_pattern: "access-list 101 deny tcp any any eq 23"
    canonical_field: AC.acl_rules
    value: "access-list 101 deny tcp any any eq 23"
  - syntax_pattern: "access-list 101 permit ip any any"
    canonical_field: AC.acl_rules
    value: "access-list 101 permit ip any any"

  # Every numbered extended-ACL line, deterministically (regex, no fixed
  # value: the matched line itself is appended to AC.acl_rules, in config
  # order - the ordered first-match rules need the full list). The two exact
  # entries above predate regex seeding and stay for backwards compatibility.
  - syntax_pattern: '^access-list \d+ (permit|deny) '
    pattern_type: regex
    canonical_field: AC.acl_rules

  # CDP disabled on an interface / globally. Added 2026-09-25 after the live
  # Tier-2 classifier inverted this exact line on a real-config sample
  # ("no cdp enable" -> SC.external_interface_cdp = true, a false STIG
  # V-216675 FAIL). Common, unambiguous syntax belongs in Tier 1.
  - syntax_pattern: "no cdp enable"
    canonical_field: SC.external_interface_cdp
    value: false
  - syntax_pattern: "no cdp run"
    canonical_field: SC.external_interface_cdp
    value: false

  # SNMP communities, deterministically. After redaction a community is
  # either literally "public"/"private" (left visible on purpose so CIS
  # 1.5.2/1.5.3 can flag them) or a redaction placeholder. Added 2026-09-25
  # after the live classifier returned the value "public RO" for
  # `snmp-server community public RO` - which would have PASSED the
  # "no default public community" check on a device that fails it.
  - syntax_pattern: '^snmp-server community public( |$)'
    pattern_type: regex
    canonical_field: AC.snmp_community_strings
    value: public
  - syntax_pattern: '^snmp-server community private( |$)'
    pattern_type: regex
    canonical_field: AC.snmp_community_strings
    value: private
  - syntax_pattern: '^snmp-server community \[REDACTED:SNMP_COMMUNITY\]'
    pattern_type: regex
    canonical_field: AC.snmp_community_strings
    value: "custom (redacted)"

  # Named extended-ACL entries (the lines under `ip access-list extended
  # NAME`), deterministically, like numbered ACL lines above. Without this
  # the verdict of every ACL rule depended on which entries the AI happened
  # to classify as ACL rules.
  # Any protocol or object-group: an entry the engine can't parse must still
  # reach it, so the verdict fails closed instead of the line being dropped
  # (found by the second review: `permit object-group X any any` was lost).
  - syntax_pattern: '^(permit|deny) \S'
    pattern_type: regex
    canonical_field: AC.acl_rules

  # Sequence-numbered named-ACL entries (`10 permit tcp ...`), same reason.
  - syntax_pattern: '^\d+ (permit|deny) \S'
    pattern_type: regex
    canonical_field: AC.acl_rules

  # A login/MOTD banner header. units.py keeps only this header line (banner
  # text is prose and never classified), so its presence is the fact.
  - syntax_pattern: '^banner (login|motd|exec) '
    pattern_type: regex
    canonical_field: AC.login_banner_configured
    value: true

  # Unambiguous global/line commands, deterministically (added 2026-09-27 so
  # verdicts on these no longer depend on the AI; measured with
  # eval/verdict_eval.py against hand-labelled configs).
  - {syntax_pattern: '^transport input (.* )?telnet\b', pattern_type: regex, canonical_field: AC.telnet_enabled, value: true}
  - {syntax_pattern: '^transport input all$', pattern_type: regex, canonical_field: AC.telnet_enabled, value: true}
  - {syntax_pattern: '^transport input (none|ssh)$', pattern_type: regex, canonical_field: AC.telnet_enabled, value: false}
  - {syntax_pattern: '^no service password-encryption$', pattern_type: regex, canonical_field: IA.password_encryption_enabled, value: false}
  - {syntax_pattern: '^enable password ', pattern_type: regex, canonical_field: AC.privileged_password_type, value: enable_password}
  - {syntax_pattern: '^ip ssh version 1$', pattern_type: regex, canonical_field: IA.ssh_version, value: 1}
  - {syntax_pattern: '^no ip source-route$', pattern_type: regex, canonical_field: SC.ip_source_routing_enabled, value: false}
  - {syntax_pattern: '^ip source-route$', pattern_type: regex, canonical_field: SC.ip_source_routing_enabled, value: true}
  - {syntax_pattern: '^no service pad$', pattern_type: regex, canonical_field: SC.pad_enabled, value: false}
  - {syntax_pattern: '^service pad$', pattern_type: regex, canonical_field: SC.pad_enabled, value: true}
  - {syntax_pattern: '^exec-timeout (\d+)( 0)?$', pattern_type: regex, canonical_field: AC.session_idle_timeout_minutes, value: "$1"}
  - {syntax_pattern: '^logging host ([\w.:-]+)', pattern_type: regex, canonical_field: AU.logging_host, value: "$1"}
  - {syntax_pattern: '^logging (\d{1,3}(?:\.\d{1,3}){3})$', pattern_type: regex, canonical_field: AU.logging_host, value: "$1"}
  - {syntax_pattern: '^ntp authenticate$', pattern_type: regex, canonical_field: AU.ntp_authentication_enabled, value: true}
  - {syntax_pattern: '^access-class \S+ in', pattern_type: regex, canonical_field: AC.vty_access_class, value: true}
  - {syntax_pattern: '^no ip proxy-arp$', pattern_type: regex, canonical_field: SC.proxy_arp_enabled, value: false}
  - {syntax_pattern: '^ip proxy-arp$', pattern_type: regex, canonical_field: SC.proxy_arp_enabled, value: true}
  # `service-policy input X` is QoS under an interface; control-plane
  # protection is decided from the `control-plane` block only (see
  # interface_defaults below). Found by the second review: an interface QoS
  # policy was passing STIG V-216650.
  - {syntax_pattern: '^service-policy (input|output) \S+$', pattern_type: regex, canonical_field: NOT_SECURITY}

  # For the imported DISA STIG catalog (rules/stig_catalog_map.yaml). Patterns
  # follow the STIG check/fix text and the IOS-XE command reference.
  # `logging enable` exists only under `archive` > `log config` (config-change
  # logging, CIS 2.2.1 and the NDM STIG audit-record checks).
  - {syntax_pattern: '^logging enable$', pattern_type: regex, canonical_field: AU.logging_enabled, value: true}
  # V-215813 wants 3 attempts AND a 15-minute block: only a block of 900 s or
  # more records the attempt count; a shorter block is no compliant lockout.
  - {syntax_pattern: '^login block-for (?:9\d\d|[1-9]\d{3,}) attempts (\d+) within \d+', pattern_type: regex, canonical_field: AC.login_max_failed_attempts, value: "$1"}
  - {syntax_pattern: '^login block-for \d+ attempts \d+', pattern_type: regex, canonical_field: AC.login_max_failed_attempts, value: 0}
  - {syntax_pattern: '^ntp server (?:vrf \S+ )?(?:ip |ipv6 )?([\w.:-]+)', pattern_type: regex, canonical_field: AU.ntp_servers, value: "$1"}
  # Child lines of `aaa common-criteria policy NAME`.
  - {syntax_pattern: '^min-length (\d+)$', pattern_type: regex, canonical_field: IA.password_min_length, value: "$1"}
  - {syntax_pattern: '^upper-case (\d+)$', pattern_type: regex, canonical_field: IA.password_min_uppercase, value: "$1"}
  - {syntax_pattern: '^lower-case (\d+)$', pattern_type: regex, canonical_field: IA.password_min_lowercase, value: "$1"}
  - {syntax_pattern: '^numeric-count (\d+)$', pattern_type: regex, canonical_field: IA.password_min_numeric, value: "$1"}
  - {syntax_pattern: '^special-case (\d+)$', pattern_type: regex, canonical_field: IA.password_min_special, value: "$1"}
  - {syntax_pattern: '^char-changes (\d+)$', pattern_type: regex, canonical_field: IA.password_min_changed_chars, value: "$1"}
  # SSH algorithm lists: SHA-2 MACs only; FIPS-approved AES ciphers only.
  - {syntax_pattern: '^ip ssh server algorithm mac( hmac-sha2-(256|512)(-etm@openssh\.com)?)+$', pattern_type: regex, canonical_field: SC.ssh_macs_fips_only, value: true}
  - {syntax_pattern: '^ip ssh server algorithm mac ', pattern_type: regex, canonical_field: SC.ssh_macs_fips_only, value: false}
  - {syntax_pattern: '^ip ssh server algorithm encryption( (aes(128|192|256)-(ctr|cbc)|aes(128|256)-gcm(@openssh\.com)?))+$', pattern_type: regex, canonical_field: SC.ssh_ciphers_fips_only, value: true}
  - {syntax_pattern: '^ip ssh server algorithm encryption ', pattern_type: regex, canonical_field: SC.ssh_ciphers_fips_only, value: false}
  # 2026-09-28, more STIG rules (RTR V3R5 / NDM V3R7 check text).
  - {syntax_pattern: '^no ip gratuitous-arps$', pattern_type: regex, canonical_field: SC.gratuitous_arp_enabled, value: false}
  - {syntax_pattern: '^ip gratuitous-arps\b', pattern_type: regex, canonical_field: SC.gratuitous_arp_enabled, value: true}
  - {syntax_pattern: '^ip directed-broadcast\b', pattern_type: regex, canonical_field: SC.ip_directed_broadcast, value: true}
  - {syntax_pattern: '^no ip cef$', pattern_type: regex, canonical_field: SC.cef_enabled, value: false}
  - {syntax_pattern: '^ip cef\b', pattern_type: regex, canonical_field: SC.cef_enabled, value: true}
  - {syntax_pattern: '^(service config|boot network \S+|cns (?:config|exec|image|trusted-server)\b.*)$', pattern_type: regex, canonical_field: SC.auto_config_features, value: "$1"}
  - {syntax_pattern: '^(ip boot server|ip bootp server|ip dns server|ip identd|ip finger|ip http server|ip rcmd r(?:cp|sh)-enable|service finger|service (?:tcp|udp)-small-servers)\b', pattern_type: regex, canonical_field: SC.nonsecure_services, value: "$1"}
  # Per-interface lines: vendor_defaults (interface_defaults below) decides
  # the field from every interface; these only record the evidence lines.
  - {syntax_pattern: '^no ip redirects$', pattern_type: regex, canonical_field: SC.icmp_redirects_all_disabled, value: true}
  - {syntax_pattern: '^no ip unreachables$', pattern_type: regex, canonical_field: SC.icmp_unreachables_all_disabled, value: true}
  - {syntax_pattern: '^no lldp run$', pattern_type: regex, canonical_field: SC.external_interface_lldp, value: false}
  - {syntax_pattern: '^service timestamps log datetime\b', pattern_type: regex, canonical_field: AU.log_timestamps, value: true}
  - {syntax_pattern: '^(service timestamps log uptime\b|no service timestamps( log)?$)', pattern_type: regex, canonical_field: AU.log_timestamps, value: false}
  - {syntax_pattern: '^login on-failure log\b', pattern_type: regex, canonical_field: AU.login_failure_logging, value: true}
  - {syntax_pattern: '^login on-success log\b', pattern_type: regex, canonical_field: AU.login_success_logging, value: true}
  - {syntax_pattern: '^logging trap (emergencies|0)$', pattern_type: regex, canonical_field: AU.logging_trap_level, value: 0}
  - {syntax_pattern: '^logging trap (alerts|1)$', pattern_type: regex, canonical_field: AU.logging_trap_level, value: 1}
  - {syntax_pattern: '^logging trap (critical|2)$', pattern_type: regex, canonical_field: AU.logging_trap_level, value: 2}
  - {syntax_pattern: '^logging trap (errors|3)$', pattern_type: regex, canonical_field: AU.logging_trap_level, value: 3}
  - {syntax_pattern: '^logging trap (warnings|4)$', pattern_type: regex, canonical_field: AU.logging_trap_level, value: 4}
  - {syntax_pattern: '^logging trap (notifications|5)$', pattern_type: regex, canonical_field: AU.logging_trap_level, value: 5}
  - {syntax_pattern: '^logging trap (informational|6)$', pattern_type: regex, canonical_field: AU.logging_trap_level, value: 6}
  - {syntax_pattern: '^logging trap (debugging|7)$', pattern_type: regex, canonical_field: AU.logging_trap_level, value: 7}
  - {syntax_pattern: '^no logging trap$', pattern_type: regex, canonical_field: AU.logging_trap_level, value: -1}
  - {syntax_pattern: '^ip http timeout-policy idle (\d+)', pattern_type: regex, canonical_field: AC.http_idle_timeout_seconds, value: "$1"}

# What IOS / IOS-XE does when the config is silent (Cisco command references;
# the CIS benchmark items exist precisely because these defaults are
# insecure). Used only for a high-confidence full export, and only ever to
# FAIL a rule - a PASS resting on a default stays NOT_EVALUATED.
defaults:
  - {field: IA.password_encryption_enabled, value: false, note: "service password-encryption is off by default"}
  - {field: AC.login_banner_configured, value: false, note: "no banner is configured by default"}
  - {field: AU.ntp_authentication_enabled, value: false, note: "ntp authenticate is off by default"}
  - {field: AU.logging_host, value: [], note: "no remote syslog host by default"}
  - {field: SC.ip_source_routing_enabled, value: true, note: "ip source-route is enabled by default"}
  - {field: SC.pad_enabled, value: true, note: "service pad is enabled by default"}
  - {field: SC.control_plane_protection, value: false, note: "no control-plane service-policy by default"}
  - {field: AC.vty_access_class, value: false, note: "VTY lines have no access-class by default"}
  - {field: IA.ssh_version, value: 1, note: "SSH runs in 1.99 compatibility mode (v1 allowed) unless ip ssh version 2"}
  - {field: AU.logging_enabled, value: false, note: "archive config-change logging is off by default"}
  - {field: AC.session_idle_timeout_minutes, value: 10, note: "exec-timeout defaults to 10 minutes"}
  - {field: SC.ssh_macs_fips_only, value: false, note: "without ip ssh server algorithm mac, the default MAC list includes hmac-sha1"}
  - {field: SC.gratuitous_arp_enabled, value: true, note: "gratuitous ARP is enabled globally unless no ip gratuitous-arps"}
  - {field: AU.login_failure_logging, value: false, note: "login on-failure log is off by default"}
  - {field: AU.login_success_logging, value: false, note: "login on-success log is off by default"}

# CIS 1.2.8 is about `line vty`: only VTY blocks decide the idle timeout
# (`exec-timeout 0 0` on the console is a different item), and a VTY block
# with no exec-timeout runs at the 10-minute default. Found by the held-out
# run: console/aux `exec-timeout 0 0` was failing the VTY rule.
# IOS says which ACLs are in force (ip access-group / access-class /
# ipv6 traffic-filter); an ACL nothing applies is not evaluated.
acl_bindings: explicit

line_scoped:
  - field: AC.session_idle_timeout_minutes
    block: '^line vty '
    value_from: '^\s*exec-timeout (\d+)(?:\s+(\d+))?'   # minutes, optional seconds
    default: 10
    note: "only VTY lines count; a VTY block without exec-timeout runs at the 10-minute default"
  # STIG V-215833 covers every management line, console included.
  - field: AC.mgmt_line_timeout_minutes
    block: '^line (con|vty) '
    value_from: '^\s*exec-timeout (\d+)(?:\s+(\d+))?'
    default: 10
    note: "console and VTY lines; a line without exec-timeout runs at the 10-minute default"

# Line presence decides these (vendor_defaults unit_facts).
unit_facts:
  # `no logging on` stops every syslog destination, whatever hosts are
  # listed (final review: two `logging host` lines still passed V-220139).
  - {field: AU.logging_host, value: [], any: '^no logging on$', note: "no logging on disables all syslog output"}
  # NTP authentication means keys, not the switch alone: a key, a trusted
  # key and a server that uses one (DISA V-215843; final review).
  - {field: AU.ntp_keys_configured, value: true, all: ['^ntp authentication-key \d+ ', '^ntp trusted-key \d+', '^ntp server .*\bkey \d+'], note: "authentication key, trusted key and a keyed server"}
  - {field: SC.http_mgmt_enabled, value: true, any: '^ip http (secure-)?server$'}
  - {field: SC.http_mgmt_enabled, value: false, all: ['^no ip http server$', '^no ip http secure-server$']}
  - {field: SC.ipv6_site_local_used, value: true, any: '^ipv6 address [fF][eE][c-fC-F][0-9a-fA-F]?:'}

# Every ipv6 address line in a full export is shown; none in FEC0::/10.
absent_facts:
  - field: SC.ipv6_site_local_used
    value: false
    lines: '^ipv6 address [0-9a-fA-F]*:[0-9a-fA-F:]*'
    none_match: '^ipv6 address [fF][eE][c-fC-F][0-9a-fA-F]?:'
    note: "no IPv6 address in the site-local FEC0::/10 range"

interface_defaults:
  - field: SC.proxy_arp_enabled
    value: true
    unless: '^\s*no ip proxy-arp\s*$'
    unless_text: no ip proxy-arp
    skip: '^interface (Loopback|Null|Tunnel|Virtual-Template)'
    note: "proxy ARP is enabled on every interface by default"
  # A VTY block with no `transport input` accepts telnet on classic IOS
  # (12.x/15.x). Later IOS-XE releases changed this default, so it is only
  # applied when the export says version 15 or older.
  - field: AC.telnet_enabled
    value: true
    block: '^line vty '
    unless: '^\s*transport input '
    unless_text: transport input
    only_if: '^version 1[0-5]\.'
    note: "on IOS 15 and older, a VTY line without transport input accepts telnet"
  # Every VTY block must restrict its sources; one block without access-class
  # leaves those lines open (found by the second review).
  - field: AC.vty_access_class
    value: false
    block: '^line vty '
    unless: '^\s*access-class \S+ in\b'
    unless_text: access-class ... in
    note: "a VTY line without access-class accepts sessions from any source"
  # Control-plane protection means a service-policy on the control-plane
  # block itself, never an interface QoS policy.
  - field: SC.control_plane_protection
    value: false
    block: '^control-plane\b'
    unless: '^\s*service-policy input \S+'
    unless_text: service-policy input
    note: "a control-plane block without service-policy input polices nothing"
  # "On all EXTERNAL interfaces" checks (STIG RTR): AEGIS can't tell which
  # interfaces are external, so every interface compliant is a PASS and any
  # interface left at the default is unknown (when_missing: unknown), never
  # a FAIL that might be about an internal interface.
  - field: SC.icmp_redirects_all_disabled
    value: false
    unless: '^\s*no ip redirects\s*$'
    skip: '^interface (Loopback|Null)'
    when_missing: unknown
    note: "every interface disables ICMP redirects"
  - field: SC.icmp_unreachables_all_disabled
    value: false
    unless: '^\s*no ip unreachables\s*$'
    skip: '^interface Loopback'
    require_block: '^interface Null0\s*$'
    when_missing: unknown
    note: "every interface, Null0 included, disables ICMP unreachables"
  - field: SC.proxy_arp_all_disabled
    value: false
    unless: '^\s*no ip proxy-arp\s*$'
    skip: '^interface (Loopback|Null|Tunnel|Virtual-Template)'
    when_missing: unknown
    note: "every interface disables proxy ARP"
  # CDP: `no cdp run` turns it off everywhere (the seed line decides);
  # otherwise every interface needs `no cdp enable`. One interface's
  # `no cdp enable` used to count for the whole device (found 2026-09-28:
  # a false PASS of the hand-written STIG V-216675).
  - field: SC.external_interface_cdp
    value: true
    unless: '^\s*no cdp enable\s*$'
    skip: '^interface (Loopback|Null|Tunnel|Virtual-Template|Vlan)'
    skip_if: '^no cdp run\s*$'
    when_missing: unknown
    note: "CDP runs on every interface without no cdp enable"
  # LLDP is off unless `lldp run`; once on, it transmits on every interface
  # without `no lldp transmit`.
  - field: SC.external_interface_lldp
    value: true
    unless: '^\s*no lldp transmit\s*$'
    skip: '^interface (Loopback|Null|Tunnel|Virtual-Template|Vlan)'
    only_if: '^lldp run\s*$'
    when_missing: unknown
    note: "LLDP transmits on every interface without no lldp transmit"
  # The aux port: `no exec` disables it; an enabled aux port may be a secured
  # modem (the STIG allows that), so it is unknown, not a FAIL.
  - field: SC.aux_port_exec_disabled
    value: false
    block: '^line aux '
    unless: '^\s*no exec\s*$'
    when_missing: unknown
    note: "the aux line disables EXEC"
