# Tier-1 seed KB for cisco_ios - exact-match only (architecture-document.md
# §1/§3 step 4: Tier 1 is deterministic exact/structural match, not a
# learned generalization). Two kinds of entries here:
#
# 1. Tied to this specific demo sample (samples/cisco_ios_sample.txt) -
#    won't match a differently-worded real config, and isn't meant to; a
#    genuinely new line correctly falls through to Tier 2/3, which is by
#    design, not a gap.
# 2. Genuinely general despite being "exact match", because redaction
#    normalizes the variable part away first - e.g. every type-5 `enable
#    secret` line redacts to the exact same text regardless of the real
#    hash, so that entry matches ANY cisco_ios config using that type, not
#    just this sample's.
#
# Found and fixed 2026-09-15: before this file existed, there was no Tier-1
# seeding at all despite architecture-document.md describing Cisco IOS as
# "Seeded Tier 1" - every prior "Tier 1 hit" in testing actually came from
# accumulated manual review-queue confirmations in a dev DB that isn't
# committed anywhere (*.db is gitignored). A fresh clone + fresh DB
# following this repo's own README would have hit Tier 2 cold for
# "transport input ssh" and gotten it wrong every time (see resolve.py's
# docstring is aspirational without this file) - verified via a direct
# repeated Tier-2 test, not assumed.

vendor: cisco_ios
entries:
  - syntax_pattern: "transport input ssh"
    canonical_field: AC.telnet_enabled
    value: false

  - syntax_pattern: "ip ssh version 2"
    canonical_field: IA.ssh_version
    value: 2

  - syntax_pattern: "service password-encryption"
    canonical_field: IA.password_encryption_enabled
    value: true

  # General (redaction-normalized) - matches any cisco_ios config using
  # that enable-secret type, not just this sample's specific hash.
  - syntax_pattern: "enable secret 5 [REDACTED:ENABLE_SECRET_HASH]"
    canonical_field: AC.privileged_password_type
    value: secret_type_5
  - syntax_pattern: "enable secret 8 [REDACTED:ENABLE_SECRET_HASH]"
    canonical_field: AC.privileged_password_type
    value: secret_type_8
  - syntax_pattern: "enable secret 9 [REDACTED:ENABLE_SECRET_HASH]"
    canonical_field: AC.privileged_password_type
    value: secret_type_9

  # Sample-specific (tied to this exact IP/ACL text).
  - syntax_pattern: "logging host 10.0.0.5"
    canonical_field: AU.logging_host
    value: "10.0.0.5"
  - syntax_pattern: "access-list 101 deny tcp any any eq 23"
    canonical_field: AC.acl_rules
    value: "access-list 101 deny tcp any any eq 23"
  - syntax_pattern: "access-list 101 permit ip any any"
    canonical_field: AC.acl_rules
    value: "access-list 101 permit ip any any"

  # Every numbered extended-ACL line, deterministically (regex, no fixed
  # value: the matched line itself is appended to AC.acl_rules, in config
  # order - the ordered first-match rules need the full list). The two exact
  # entries above predate regex seeding and stay for backwards compatibility.
  - syntax_pattern: '^access-list \d+ (permit|deny) '
    pattern_type: regex
    canonical_field: AC.acl_rules

  # CDP disabled on an interface / globally. Added 2026-09-25 after the live
  # Tier-2 classifier inverted this exact line on a real-config sample
  # ("no cdp enable" -> SC.external_interface_cdp = true, a false STIG
  # V-216675 FAIL). Common, unambiguous syntax belongs in Tier 1.
  - syntax_pattern: "no cdp enable"
    canonical_field: SC.external_interface_cdp
    value: false
  - syntax_pattern: "no cdp run"
    canonical_field: SC.external_interface_cdp
    value: false

  # SNMP communities, deterministically. After redaction a community is
  # either literally "public"/"private" (left visible on purpose so CIS
  # 1.5.2/1.5.3 can flag them) or a redaction placeholder. Added 2026-09-25
  # after the live classifier returned the value "public RO" for
  # `snmp-server community public RO` - which would have PASSED the
  # "no default public community" check on a device that fails it.
  - syntax_pattern: '^snmp-server community public( |$)'
    pattern_type: regex
    canonical_field: AC.snmp_community_strings
    value: public
  - syntax_pattern: '^snmp-server community private( |$)'
    pattern_type: regex
    canonical_field: AC.snmp_community_strings
    value: private
  - syntax_pattern: '^snmp-server community \[REDACTED:SNMP_COMMUNITY\]'
    pattern_type: regex
    canonical_field: AC.snmp_community_strings
    value: "custom (redacted)"

  # Named extended-ACL entries (the lines under `ip access-list extended
  # NAME`), deterministically, like numbered ACL lines above. Without this
  # the verdict of every ACL rule depended on which entries the AI happened
  # to classify as ACL rules.
  - syntax_pattern: '^(permit|deny) (ip|tcp|udp|icmp|\d+) '
    pattern_type: regex
    canonical_field: AC.acl_rules
