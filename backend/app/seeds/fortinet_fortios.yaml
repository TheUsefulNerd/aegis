# Fortinet FortiGate (FortiOS), added 2026-09-27 as data only: fingerprint +
# Tier-1 patterns, no Python. units.py flattens FortiOS `config ... / edit
# ... / set ... / next / end` blocks into one line per setting with its path,
# e.g. `system global set admintimeout 5`, which is what these match.
#
# Patterns follow the FortiOS CLI reference (config system global, system
# interface allowaccess, log syslogd setting, system snmp community).
# Firewall policies are reassembled by units.py into ordered
# `access-list fortios-<srcintf> ...` lines (one per service), so the same
# ordered first-match rules apply as on Cisco, pfSense and SONiC.

fingerprint:
  format: cli
  version_family: fortios
  priority: 10
  signals:
    - '^#config-version=F'
    - '^config system global\s*$'
    - '^config firewall policy\s*$'
  min: 1
  high_at: 2

vendor: fortinet_fortios
entries:
  - {syntax_pattern: '^system global set admin-telnet enable\b', pattern_type: regex, canonical_field: AC.telnet_enabled, value: true}
  - {syntax_pattern: '^system global set admin-telnet disable\b', pattern_type: regex, canonical_field: AC.telnet_enabled, value: false}
  - {syntax_pattern: '^system interface edit \S+ set allowaccess .*\btelnet\b', pattern_type: regex, canonical_field: AC.telnet_enabled, value: true}
  - {syntax_pattern: '^system interface edit \S+ set allowaccess .*\bhttp\b', pattern_type: regex, canonical_field: SC.webgui_protocol, value: false}
  - {syntax_pattern: '^system global set admintimeout (\d+)', pattern_type: regex, canonical_field: AC.session_idle_timeout_minutes, value: "$1"}
  - {syntax_pattern: '^system global set pre-login-banner enable\b', pattern_type: regex, canonical_field: AC.login_banner_configured, value: true}
  # Remote logging: syslogd..syslogd4 or FortiAnalyzer..fortianalyzer3.
  - {syntax_pattern: '^log (syslogd\d?|fortianalyzer\d?) setting set status enable\b', pattern_type: regex, canonical_field: AU.logging_enabled, value: true}
  - {syntax_pattern: '^log (?:syslogd\d?|fortianalyzer\d?) setting set server "?([\w.:-]+)', pattern_type: regex, canonical_field: AU.logging_host, value: "$1"}
  - {syntax_pattern: '^system snmp community edit \S+ set name "?(public|private)\b', pattern_type: regex, canonical_field: AC.snmp_community_strings, value: "$1"}
  - {syntax_pattern: '^system ntp set authentication enable\b', pattern_type: regex, canonical_field: AU.ntp_authentication_enabled, value: true}

  # For the imported DISA STIG catalog (rules/stig_catalog_map.yaml); keywords
  # follow the FortiGate NDM STIG check text. Event and system logging both
  # default to enable, so a plain export often omits them (field absent).
  - {syntax_pattern: '^log eventfilter set (event|system) disable\b', pattern_type: regex, canonical_field: AU.admin_event_logging, value: false}
  - {syntax_pattern: '^log eventfilter set (event|system) enable\b', pattern_type: regex, canonical_field: AU.admin_event_logging, value: true}
  # A disabled password policy enforces no minimum: 0 (the lowest wins).
  - {syntax_pattern: '^system password-policy set status enable\b', pattern_type: regex, canonical_field: IA.password_policy_enabled, value: true}
  - {syntax_pattern: '^system password-policy set status disable\b', pattern_type: regex, canonical_field: IA.password_policy_enabled, value: false}
  - {syntax_pattern: '^system password-policy set minimum-length (\d+)', pattern_type: regex, canonical_field: IA.password_min_length, value: "$1"}
  - {syntax_pattern: '^system password-policy set min-upper-case-letter (\d+)', pattern_type: regex, canonical_field: IA.password_min_uppercase, value: "$1"}
  - {syntax_pattern: '^system password-policy set min-lower-case-letter (\d+)', pattern_type: regex, canonical_field: IA.password_min_lowercase, value: "$1"}
  - {syntax_pattern: '^system password-policy set min-number (\d+)', pattern_type: regex, canonical_field: IA.password_min_numeric, value: "$1"}
  - {syntax_pattern: '^system password-policy set min-non-alphanumeric (\d+)', pattern_type: regex, canonical_field: IA.password_min_special, value: "$1"}
  - {syntax_pattern: '^system password-policy set change-8-characters enable\b', pattern_type: regex, canonical_field: IA.password_min_changed_chars, value: 8}
  - {syntax_pattern: '^system password-policy set change-8-characters disable\b', pattern_type: regex, canonical_field: IA.password_min_changed_chars, value: 0}
  # 2026-09-28, more FortiGate NDM STIG rules (V1R5 check text).
  - {syntax_pattern: '^system global set admin-lockout-threshold (\d+)', pattern_type: regex, canonical_field: AC.login_max_failed_attempts, value: "$1"}
  - {syntax_pattern: '^system global set admin-lockout-duration (\d+)', pattern_type: regex, canonical_field: AC.login_lockout_seconds, value: "$1"}
  - {syntax_pattern: '^system fips-cc set status enable\b', pattern_type: regex, canonical_field: SC.fips_mode_enabled, value: true}
  - {syntax_pattern: '^system fips-cc set status disable\b', pattern_type: regex, canonical_field: SC.fips_mode_enabled, value: false}
  - {syntax_pattern: '^system ntp set ntpsync enable\b', pattern_type: regex, canonical_field: AU.ntp_sync_enabled, value: true}
  - {syntax_pattern: '^system ntp set ntpsync disable\b', pattern_type: regex, canonical_field: AU.ntp_sync_enabled, value: false}
  - {syntax_pattern: '^system ntp set type custom\b', pattern_type: regex, canonical_field: AU.ntp_custom_servers, value: true}
  - {syntax_pattern: '^system ntp set type fortiguard\b', pattern_type: regex, canonical_field: AU.ntp_custom_servers, value: false}
  - {syntax_pattern: '^system ntp ntpserver edit \S+ set server "?([\w.:-]+)', pattern_type: regex, canonical_field: AU.ntp_servers, value: "$1"}

  - {syntax_pattern: '^access-list fortios-\S+ (permit|deny) ', pattern_type: regex, canonical_field: AC.acl_rules}
  - {syntax_pattern: '^firewall policy edit \S+ set (name|comments|srcintf|dstintf|srcaddr|dstaddr|action|schedule|service|status|nat|logtraffic) ', pattern_type: regex, canonical_field: NOT_SECURITY}

  # Known non-security structure.
  # Service and address objects only name ports and hosts (every FortiGate
  # ships a predefined TELNET service on port 23); the policies that use them
  # become ACL lines above. Found by the held-out run: the AI read
  # `firewall service custom edit TELNET set tcp-portrange 23` as telnet enabled.
  - {syntax_pattern: '^firewall (service (custom|group|category)|address6?|addrgrp6?) edit ', pattern_type: regex, canonical_field: NOT_SECURITY}
  - {syntax_pattern: '^system global set (hostname|timezone|alias|gui-theme) ', pattern_type: regex, canonical_field: NOT_SECURITY}
  - {syntax_pattern: '^system interface edit \S+ set (ip|type|vdom|mode|role|vlanid|interface) ', pattern_type: regex, canonical_field: NOT_SECURITY}
  - {syntax_pattern: '^router static edit \d+ set ', pattern_type: regex, canonical_field: NOT_SECURITY}
  - {syntax_pattern: '^system dns set ', pattern_type: regex, canonical_field: NOT_SECURITY}

# Vendor defaults (vendor_defaults.py): only for a high-confidence full
# export, and only ever to FAIL a rule.
defaults:
  - {field: AU.logging_host, value: [], note: "log syslogd setting is disabled, with no server, by default"}
  - {field: IA.password_policy_enabled, value: false, note: "config system password-policy is disabled by default"}
  - {field: AC.login_lockout_seconds, value: 60, note: "admin-lockout-duration defaults to 60 seconds"}
  - {field: AC.session_idle_timeout_minutes, value: 5, note: "admintimeout defaults to 5 minutes"}
  - {field: SC.fips_mode_enabled, value: false, note: "FIPS-CC mode is disabled by default"}
  - {field: AU.ntp_custom_servers, value: false, note: "NTP uses the FortiGuard servers (type fortiguard) by default"}

# Every table entry must carry the lines (full export only).
entry_scoped:
  - field: IA.ldap_uses_ldaps
    label: LDAP server
    entry: '^user ldap edit (\S+) '
    require: ['^set secure ldaps\b']
    note: "every LDAP server connects with set secure ldaps"
  # V-234201: security-level auth (or auth-priv) AND a SHA-2 auth-proto;
  # the default sha (SHA-1) and no-auth-no-priv are hidden by `show`.
  - field: SC.snmpv3_auth_sha2
    label: SNMPv3 user
    entry: '^system snmp user edit (\S+) '
    require: ['^set security-level (auth-priv|auth-no-priv)\b', '^set auth-proto sha(256|384|512)\b']
    note: "every SNMPv3 user authenticates with SHA-256 or stronger"

# Explicit evidence from the whole export: administrative telnet is reachable
# only through an interface's allowaccess list, so when every allowaccess
# line in a full export omits telnet, telnet is off. (A line that includes
# telnet, or `admin-telnet enable`, is matched by the entries above instead.)
absent_facts:
  - field: AC.telnet_enabled
    value: false
    lines: '^system interface edit \S+ (ipv6 )?set (ip6-)?allowaccess '
    none_match: '\btelnet\b'
    note: "no interface allowaccess list includes telnet"

# A password policy only protects administrators when its scope includes
# them: `set apply-to` without admin-password leaves admin passwords
# unconstrained (DISA step: "Verify Password scope is enabled for Admin";
# final review). The FortiOS default scope is admin-password.
unit_facts:
  # A log server only receives logs when that log device is switched on;
  # FortiOS defaults `log syslogd setting` to status disable (final review #4:
  # a server with status disable passed AU-4(1)).
  - {field: AU.logging_host, value: [], any: '^log (syslogd\d?|fortianalyzer\d?) setting set server ', none: '^log (syslogd\d?|fortianalyzer\d?) setting set status enable\b', note: "log server configured but the log device is not enabled"}
  - {field: IA.password_policy_enabled, value: false, any: '^system password-policy set apply-to (?!.*\badmin-password\b)', note: "policy scope excludes admin passwords"}
