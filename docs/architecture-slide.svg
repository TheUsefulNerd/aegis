<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 458" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <!-- AEGIS pipeline as built (2026-09-25), laid out for the idea-PPT
       "Technical Approach" slide: the top-right ~41% x 43% is left empty
       because the slide's TECH STACK box sits there. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8064A2"/></marker>
  </defs>
  <style>
    .t { fill:#fff; font-size:15px; font-weight:700; text-anchor:middle; }
    .s { fill:#fff; font-size:12px; text-anchor:middle; }
    .l { fill:#333; font-size:11.5px; font-style:italic; }
    .h { fill:#1F497D; font-size:12.5px; font-weight:700; letter-spacing:0.5px; }
    .e { stroke:#444; stroke-width:1.7; fill:none; marker-end:url(#a); }
    .x { stroke:#C0504D; stroke-width:2; fill:none; marker-end:url(#r); }
    .d { stroke:#8064A2; stroke-width:1.7; fill:none; stroke-dasharray:6 4; marker-end:url(#p); }
  </style>

  <rect x="10" y="22" width="125" height="84" rx="9" fill="#595959"/>
  <text class="t" x="72" y="54">Config upload</text><text class="s" x="72" y="73">single or bulk</text><text class="s" x="72" y="89">CLI · XML · JSON</text>
  <rect x="157" y="22" width="125" height="84" rx="9" fill="#4BACC6"/>
  <text class="t" x="219" y="54">1 · Redaction</text><text class="s" x="219" y="73">11 secret types →</text><text class="s" x="219" y="89">typed placeholders</text>
  <rect x="304" y="22" width="125" height="84" rx="9" fill="#4BACC6"/>
  <text class="t" x="366" y="54">2 · Fingerprint</text><text class="s" x="366" y="73">vendor, format</text><text class="s" x="366" y="89">+ device identity</text>
  <rect x="451" y="22" width="125" height="84" rx="9" fill="#C0504D"/>
  <text class="t" x="513" y="54">3 · Sanity gate</text><text class="s" x="513" y="73">text trying to</text><text class="s" x="513" y="89">instruct the AI?</text>
  <path class="e" d="M135,64 H155"/><path class="e" d="M282,64 H302"/><path class="e" d="M429,64 H449"/>

  <rect x="10" y="207" width="175" height="84" rx="9" fill="#8064A2"/>
  <text class="t" x="97" y="239">4 · Tier 1</text><text class="s" x="97" y="258">exact / regex KB match</text><text class="s" x="97" y="274">instant · deterministic</text>
  <rect x="260" y="207" width="175" height="84" rx="9" fill="#8064A2"/>
  <text class="t" x="347" y="239">Tier 2 · LLM</text><text class="s" x="347" y="258">Groq → Gemini fallback</text><text class="s" x="347" y="274">schema + type validated</text>
  <rect x="520" y="207" width="200" height="84" rx="9" fill="#8064A2" stroke="#5f4a7d" stroke-width="3"/>
  <text class="t" x="620" y="239">Tier 3 · Review queue</text><text class="s" x="620" y="258">human confirms once</text><text class="s" x="620" y="274">+ auditor judgment</text>
  <path d="M800,217 a62,11 0 0 1 124,0 v64 a62,11 0 0 1 -124,0 z" fill="#8064A2"/>
  <path d="M800,217 a62,11 0 0 0 124,0" fill="none" stroke="#5f4a7d" stroke-width="1.5"/>
  <text class="t" x="862" y="252">Knowledge</text><text class="t" x="862" y="270">base</text>

  <path class="e" d="M470,106 V150 H97 V205"/><text class="l" x="200" y="144">clean text</text>
  <path class="x" d="M556,106 V205"/><text class="l" x="548" y="172" fill="#C0504D" text-anchor="end">blocked before</text><text class="l" x="548" y="186" fill="#C0504D" text-anchor="end">any LLM call</text>
  <path class="e" d="M185,249 H258"/><text class="l" x="204" y="242">miss</text>
  <path class="e" d="M435,249 H518"/><text class="l" x="444" y="242">unsure</text>
  <path class="e" d="M720,249 H798"/><text class="l" x="727" y="242">learned</text>
  <path class="d" d="M862,292 V318 H60 V293"/><text class="l" x="560" y="312" fill="#5f4a7d">next device: recognized instantly, no redeploy</text>

  <rect x="10" y="340" width="210" height="84" rx="9" fill="#4F81BD"/>
  <text class="t" x="115" y="372">5 · Canonical model</text><text class="s" x="115" y="391">NIST 800-53 families</text><text class="s" x="115" y="407">+ per-field provenance</text>
  <rect x="290" y="340" width="210" height="84" rx="9" fill="#1F497D"/>
  <text class="t" x="395" y="372">6 · Rule engine</text><text class="s" x="395" y="391">39 cited rules · 6 predicates</text><text class="s" x="395" y="407">CIS · NIST · STIG · ISO</text>
  <rect x="570" y="340" width="210" height="84" rx="9" fill="#9BBB59"/>
  <text class="t" x="675" y="372">7 · PDF report</text><text class="s" x="675" y="391">PASS · FAIL · NOT_EVALUATED</text><text class="s" x="675" y="407">+ vetted remediation</text>
  <path class="e" d="M130,291 V338"/><text class="l" x="136" y="333">hit</text>
  <path class="e" d="M347,291 V328 H200 V338"/><text class="l" x="354" y="307">accepted</text>
  <path class="e" d="M220,382 H288"/><path class="e" d="M500,382 H568"/>
  <text class="l" x="800" y="364">never a silent PASS:</text>
  <text class="l" x="800" y="380">an unseen setting is</text>
  <text class="l" x="800" y="396">reported NOT_EVALUATED</text>
</svg>
