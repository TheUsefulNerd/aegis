<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 458" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <!-- AEGIS pipeline as built, in six labelled phases, with the trust model
       (2026-09-25). Same layout as architecture-slide.svg (idea PPT), with
       the corner that slide keeps free for its TECH STACK box filled in. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
  </defs>
  <style>
    .ph { font-size: 12px; font-weight: 800; letter-spacing: 0.4px; }
    .phs { font-size: 10.5px; font-style: italic; }
    .t { fill: #fff; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
    .s { fill: #fff; font-size: 10.5px; text-anchor: middle; }
    .l { fill: #374151; font-size: 10px; font-style: italic; }
    .e { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .x { stroke: #C0504D; stroke-width: 1.8; fill: none; marker-end: url(#r); }
    .d { stroke: #2E7D32; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#g); }
  </style>

  <!-- 1 PROTECT -->
  <rect x="4" y="4" width="330" height="154" rx="12" fill="#EAF6F9" stroke="#4BACC6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="16" y="22" fill="#1B6F82"><tspan class="ph">1 · PROTECT</tspan><tspan class="phs" dx="8">before anything else runs</tspan></text>
  <rect x="14" y="32" width="95" height="66" rx="8" fill="#595959"/>
  <text class="t" x="61" y="58">Upload</text><text class="s" x="61" y="75">single or bulk</text><text class="s" x="61" y="89">CLI · XML · JSON</text>
  <rect x="121" y="32" width="95" height="66" rx="8" fill="#4BACC6"/>
  <text class="t" x="168" y="58">Redaction</text><text class="s" x="168" y="75">11 secret types</text><text class="s" x="168" y="89">never stored</text>
  <rect x="228" y="32" width="98" height="66" rx="8" fill="#C0504D"/>
  <text class="t" x="277" y="58">Sanity gate</text><text class="s" x="277" y="75">text that talks</text><text class="s" x="277" y="89">to the AI? block</text>
  <path class="e" d="M109,65 H119"/><path class="e" d="M216,65 H226"/>
  <text class="l" x="16" y="117">Secrets replaced before any AI</text>
  <text class="l" x="16" y="130">or log sees the file; injection</text>
  <text class="l" x="16" y="143">text quarantined before any AI call.</text>

  <!-- 2 NORMALIZE -->
  <rect x="344" y="4" width="236" height="154" rx="12" fill="#EEF3FA" stroke="#4F81BD" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text class="ph" x="356" y="22" fill="#2F5C8A">2 · NORMALIZE</text>
  <rect x="354" y="32" width="105" height="66" rx="8" fill="#4F81BD"/>
  <text class="t" x="406" y="58">Fingerprint</text><text class="s" x="406" y="75">vendor + format</text><text class="s" x="406" y="89">+ device identity</text>
  <rect x="467" y="32" width="105" height="66" rx="8" fill="#4F81BD"/>
  <text class="t" x="519" y="58">Units</text><text class="s" x="519" y="75">lines / paths; ACL</text><text class="s" x="519" y="89">rules reassembled</text>
  <path class="e" d="M326,65 H352"/><path class="e" d="M459,65 H465"/>
  <text class="l" x="351" y="117">One unified parser for any vendor: a</text>
  <text class="l" x="351" y="130">known vendor is a cache hit, not code.</text>

  <!-- 3 AI-ASSISTED RESOLUTION -->
  <rect x="4" y="198" width="470" height="118" rx="12" fill="#F3EFF8" stroke="#8064A2" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="16" y="216" fill="#5F4A7D"><tspan class="ph">3 · AI-ASSISTED RESOLUTION</tspan><tspan class="phs" dx="8">AI suggests, it never decides</tspan></text>
  <rect x="14" y="225" width="190" height="76" rx="8" fill="#8064A2"/>
  <text class="t" x="109" y="250">Tier 1 · Knowledge base</text><text class="s" x="109" y="267">exact / regex match</text><text class="s" x="109" y="282">instant, deterministic, no AI</text>
  <rect x="236" y="225" width="226" height="76" rx="8" fill="#8064A2"/>
  <text class="t" x="349" y="250">Tier 2 · AI suggestion</text><text class="s" x="349" y="267">schema + type validated</text><text class="s" x="349" y="282">unsure or invalid: to a human</text>
  <path class="e" d="M204,263 H234"/><text class="l" x="207" y="256">miss</text>

  <!-- 4 HUMAN IN THE LOOP -->
  <rect x="484" y="198" width="512" height="118" rx="12" fill="#EAF5EA" stroke="#2E7D32" stroke-width="2.4"/>
  <text x="986" y="216" text-anchor="end" fill="#1B5E20"><tspan class="ph">4 · HUMAN IN THE LOOP</tspan><tspan class="phs" dx="8">the reviewer decides; every decision is recorded</tspan></text>
  <rect x="496" y="225" width="150" height="76" rx="8" fill="#6A9E3F"/>
  <text class="t" x="571" y="250">Review queue</text><text class="s" x="571" y="267">unsure, unknown and</text><text class="s" x="571" y="282">blocked lines</text>
  <rect x="664" y="225" width="150" height="76" rx="38" fill="#2E7D32"/>
  <text class="t" x="739" y="250">Reviewer</text><text class="s" x="739" y="267">confirms · corrects · rejects</text><text class="s" x="739" y="282">+ security judgment + notes</text>
  <rect x="832" y="225" width="154" height="76" rx="8" fill="#6A9E3F"/>
  <text class="t" x="909" y="250">"Becomes permanent"</text><text class="s" x="909" y="267">explicit check, then a</text><text class="s" x="909" y="282">new Tier-1 pattern</text>
  <path class="e" d="M462,263 H494"/>
  <path class="e" d="M646,263 H662"/><path class="e" d="M814,263 H830"/>

  <!-- flows between phases -->
  <path class="e" d="M519,98 V180 H9 V263 H12"/>
  <path class="x" d="M277,98 V188 H520 V223"/><text class="l" x="283" y="118" fill="#C0504D">blocked,</text><text class="l" x="283" y="131" fill="#C0504D">no AI call</text>
  <path class="d" d="M909,301 V322 H60 V303"/><text class="l" x="986" y="334" text-anchor="end" fill="#1B5E20">learned once: every future device recognizes it instantly, no redeploy</text>

  <!-- 5 DETERMINISTIC VERDICT -->
  <rect x="4" y="340" width="640" height="96" rx="12" fill="#EDF1F7" stroke="#1F497D" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="634" y="356" text-anchor="end" fill="#1F497D"><tspan class="ph">5 · DETERMINISTIC VERDICT</tspan><tspan class="phs" dx="8">rules judge, no AI involved</tspan></text>
  <rect x="14" y="364" width="170" height="64" rx="8" fill="#4F81BD"/>
  <text class="t" x="99" y="388">Canonical model</text><text class="s" x="99" y="404">NIST 800-53 families</text><text class="s" x="99" y="418">+ provenance per field</text>
  <rect x="200" y="364" width="190" height="64" rx="8" fill="#1F497D"/>
  <text class="t" x="295" y="388">Rule engine</text><text class="s" x="295" y="404">39 cited rules · CIS NIST</text><text class="s" x="295" y="418">STIG ISO · 6 predicates</text>
  <rect x="406" y="364" width="228" height="64" rx="8" fill="#1F497D"/>
  <text class="t" x="520" y="388">PASS · FAIL · NOT_EVALUATED</text><text class="s" x="520" y="404">a setting never seen is</text><text class="s" x="520" y="418">never a silent PASS</text>
  <path class="e" d="M184,396 H198"/><path class="e" d="M390,396 H404"/>
  <path class="e" d="M120,301 V362"/><text class="l" x="126" y="336">hit</text>
  <path class="e" d="M300,301 V330 H170 V362"/><text class="l" x="306" y="312">accepted</text>

  <!-- 6 AUDITABLE REPORT -->
  <rect x="654" y="340" width="342" height="96" rx="12" fill="#F2F7EA" stroke="#9BBB59" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text class="ph" x="666" y="356" fill="#5A7A2A">6 · AUDITABLE REPORT</text>
  <rect x="664" y="364" width="152" height="64" rx="8" fill="#9BBB59"/>
  <text class="t" x="740" y="388">Per-device PDF</text><text class="s" x="740" y="404">executive summary</text><text class="s" x="740" y="418">+ vetted fix commands</text>
  <rect x="830" y="364" width="156" height="64" rx="8" fill="#9BBB59"/>
  <text class="t" x="908" y="388">Evidence trail</text><text class="s" x="908" y="404">source line + how decided:</text><text class="s" x="908" y="418">instant · AI · human</text>
  <path class="e" d="M634,396 H662"/><path class="e" d="M816,396 H828"/>

  <!-- trust model -->
  <rect x="594" y="4" width="402" height="176" rx="12" fill="#0F172A"/>
  <text x="612" y="30" fill="#FFFFFF" font-size="15" font-weight="800">The trust model</text>
  <text x="612" y="58" fill="#C7D2FE" font-size="12"><tspan font-weight="700" fill="#FFFFFF">AI suggests.</tspan> It proposes a field and value; schema</text>
  <text x="612" y="74" fill="#C7D2FE" font-size="12">and type checks reject anything invented.</text>
  <text x="612" y="100" fill="#C7D2FE" font-size="12"><tspan font-weight="700" fill="#BEF264">Humans decide.</tspan> Every unsure or blocked line goes</text>
  <text x="612" y="116" fill="#C7D2FE" font-size="12">to a reviewer; one decision is reused everywhere.</text>
  <text x="612" y="142" fill="#C7D2FE" font-size="12"><tspan font-weight="700" fill="#93C5FD">Rules judge.</tspan> PASS / FAIL comes only from cited,</text>
  <text x="612" y="158" fill="#C7D2FE" font-size="12">deterministic rules. Nothing unseen is a silent PASS.</text>
</svg>
